<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | CyberMa</title>

  <style>
    @font-face {
      font-family: "JetBrains Mono";
      src: url("/font/JetBrainsMono-Regular.woff2") format("woff2");
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111315 url("/CyberMa/img/1.jpg") center center / cover no-repeat;
      color: #ECECEC;
      font-family: "JetBrains Mono", monospace;
    }

    main {
      display: flex;
      align-items: center;
      gap: 80px;
      padding: 40px;
    }

    #logo img {
      width: 280px;
      user-select: none;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 70px;
      color: #64d2ff;
    }

    h2 {
      margin: 10px 0 25px;
      font-size: 24px;
      font-weight: normal;
      color: #bbb;
    }

    p {
      color: #9e9e9e;
      line-height: 1.8;
      max-width: 420px;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 15px;
    }

    a {
      color: #64d2ff;
      text-decoration: none;
      border: 1px solid #64d2ff;
      padding: 10px 18px;
      transition: .25s;
    }

    a:hover {
      background: #64d2ff;
      color: #111;
    }

    @media (max-width:768px) {

      main {
        flex-direction: column;
        text-align: center;
        gap: 20px;
      }

      #logo img {
        width: 170px;
        opacity: .3;
      }

      .buttons {
        justify-content: center;
      }

    }
  </style>
</head>

<body>

  <main>

    <div>

      <h1>404</h1>

      <h2>Page Not Found</h2>

      <p style="color: #111;">
        The page you're looking for doesn't exist or has been moved.
        Return to CyberMa and continue exploring.
      </p>

      <div class="buttons">
        <a href="/CyberMa/">Home</a>
        <a href="javascript:history.back()">Go Back</a>
      </div>

    </div>

  </main>

</body>

</html>
